<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Flap Clock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Archivo:ital,wght@0,500;0,600;1,500&display=swap');

  * {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }

  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    background-color: #0a0b0d;
    position: relative;
  }

  /* ============ skin: base backgrounds ============ */

  body.skin-classic {
    background-color: #0a0b0d;
    background: -webkit-radial-gradient(50% 42%, ellipse farthest-side, #191510 0%, #0a0b0d 68%);
  }

  body.skin-volumetric {
    background-color: #06070a;
    background: -webkit-radial-gradient(50% 38%, ellipse farthest-side, #12161f 0%, #06070a 70%);
  }

  body.skin-fire { background-color: #0c0503; }

  body.skin-neon {
    background-color: #05050a;
    background: -webkit-radial-gradient(50% 60%, ellipse farthest-side, #100a1c 0%, #05050a 72%);
  }

  /* ============ glow skin: ambient bloom (color set via JS, see applyGlowColor) ============ */

  .glow {
    display: none;
    position: absolute;
    bottom: -220px;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    pointer-events: none;
  }
  body.skin-fire .glow { display: block; }

  .glow-a {
    left: 50%;
    margin-left: -240px;
    -webkit-animation: glowPulseA 3.6s ease-in-out infinite;
  }
  .glow-b {
    left: 18%;
    -webkit-animation: glowPulseB 4.4s ease-in-out infinite;
  }
  .glow-c {
    left: 68%;
    -webkit-animation: glowPulseC 5.1s ease-in-out infinite;
  }

  @-webkit-keyframes glowPulseA {
    0%, 100% { -webkit-transform: scale(1) translateY(0); opacity: 0.85; }
    50%      { -webkit-transform: scale(1.12) translateY(-30px); opacity: 1; }
  }
  @-webkit-keyframes glowPulseB {
    0%, 100% { -webkit-transform: scale(0.95) translateY(0); opacity: 0.7; }
    50%      { -webkit-transform: scale(1.08) translateY(-22px); opacity: 0.95; }
  }
  @-webkit-keyframes glowPulseC {
    0%, 100% { -webkit-transform: scale(1.05) translateY(0); opacity: 0.75; }
    50%      { -webkit-transform: scale(0.94) translateY(-26px); opacity: 1; }
  }

  /* ============ clock layout (skin-independent) ============ */

  .stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 682px;
    margin-left: -341px;
    -webkit-transform: translateY(-50%);
    transform: translateY(-50%);
    text-align: center;
    z-index: 2;
  }

  .board { display: inline-block; }

  .colon {
    float: left;
    width: 20px;
    height: 170px;
    margin: 0 12px;
    position: relative;
  }

  .colon i {
    display: block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    opacity: 0.6;
    font-style: normal;
    position: absolute;
    left: 5px;
  }

  .colon i.dot-top { top: 68px; }
  .colon i.dot-bottom { top: 92px; }

  .grp { float: left; }
  .grp.hidden { display: none; }
  .colon.hidden { display: none; }

  .grp .flap-unit { float: left; margin-right: 6px; }
  .grp .flap-unit:last-child { margin-right: 0; }

  .flap-unit {
    position: relative;
    width: 96px;
    height: 170px;
    border-radius: 8px;
    -webkit-border-radius: 8px;
    -webkit-perspective: 600px;
    perspective: 600px;
    font-family: "Big Shoulders Display", "Arial Narrow", Arial, sans-serif;
    font-weight: 800;
  }

  .flap-half {
    position: absolute;
    left: 0;
    right: 0;
    height: 85px;
    overflow: hidden;
  }

  .flap-half span {
    position: absolute;
    left: 0;
    right: 0;
    height: 170px;
    text-align: center;
    font-size: 98px;
    line-height: 170px;
  }

  .flap-top { top: 0; border-radius: 8px 8px 0 0; -webkit-border-radius: 8px 8px 0 0; }
  .flap-top span { top: 0; }

  .flap-bottom { bottom: 0; border-radius: 0 0 8px 8px; -webkit-border-radius: 0 0 8px 8px; }
  .flap-bottom span { top: -85px; }

  .flap-unit .seam {
    position: absolute;
    left: 0;
    right: 0;
    top: 85px;
    height: 2px;
    z-index: 5;
  }

  .leaf {
    position: absolute;
    left: 0;
    right: 0;
    height: 85px;
    overflow: hidden;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    opacity: 0;
    z-index: 4;
  }

  .flap-unit.flipping .leaf { opacity: 1; }

  .leaf span {
    position: absolute;
    left: 0;
    right: 0;
    height: 170px;
    text-align: center;
    font-size: 98px;
    line-height: 170px;
  }

  .leaf-front {
    top: 0;
    border-radius: 8px 8px 0 0;
    -webkit-border-radius: 8px 8px 0 0;
    -webkit-transform-origin: bottom center;
    transform-origin: bottom center;
  }
  .leaf-front span { top: 0; }

  .leaf-back {
    bottom: 0;
    border-radius: 0 0 8px 8px;
    -webkit-border-radius: 0 0 8px 8px;
    -webkit-transform-origin: top center;
    transform-origin: top center;
    -webkit-transform: rotateX(90deg);
    transform: rotateX(90deg);
  }
  .leaf-back span { top: -85px; }

  /* Each leaf is only ever visible for a QUARTER turn (past that it is
     edge-on and backface-visibility hides it), so each animates only that
     visible quarter -- not the full half-turn -- for its whole duration.
     leaf-front plays 0-160ms (0deg -> -90deg, ending edge-on exactly as it
     disappears); leaf-back starts right where that ends, at 160ms, already
     edge-on (90deg) and plays 160-320ms (90deg -> 0deg) into full view.
     Back-to-back, with no dead gap -- see setDigit()'s topTimer/bottomTimer,
     which swap each static half's text at that same 160ms / 320ms instant. */
  .flap-unit.flipping .leaf-front {
    -webkit-animation: flipDown 0.16s linear forwards;
    animation: flipDown 0.16s linear forwards;
  }
  .flap-unit.flipping .leaf-back {
    -webkit-animation: flipUp 0.16s linear 0.16s forwards;
    animation: flipUp 0.16s linear 0.16s forwards;
  }

  @-webkit-keyframes flipDown {
    from { -webkit-transform: rotateX(0deg); }
    to   { -webkit-transform: rotateX(-90deg); }
  }
  @keyframes flipDown {
    from { transform: rotateX(0deg); }
    to   { transform: rotateX(-90deg); }
  }
  @-webkit-keyframes flipUp {
    from { -webkit-transform: rotateX(90deg); }
    to   { -webkit-transform: rotateX(0deg); }
  }
  @keyframes flipUp {
    from { transform: rotateX(90deg); }
    to   { transform: rotateX(0deg); }
  }

  .date {
    margin-top: 28px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* ============ skin: classic ============ */
  .skin-classic .flap-unit { background-color: #161514; -webkit-box-shadow: 0 14px 34px rgba(0,0,0,0.55); box-shadow: 0 14px 34px rgba(0,0,0,0.55); }
  .skin-classic .flap-half { background-color: #201f1e; color: #f0e9da; }
  .skin-classic .leaf { background-color: #201f1e; color: #f0e9da; }
  .skin-classic .seam { background-color: #030303; }
  .skin-classic .colon i { background-color: #a89f8d; }
  .skin-classic .date { color: #a89f8d; }

  /* ============ skin: volumetric ============ */
  .skin-volumetric .flap-unit {
    background-color: #14181f;
    -webkit-box-shadow: 0 22px 46px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.04);
    box-shadow: 0 22px 46px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .skin-volumetric .flap-half {
    background-color: #262c38;
    background: -webkit-linear-gradient(top, #333b4a 0%, #262c38 45%, #1a1e26 100%);
    color: #fdfdfb;
    -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -10px 18px rgba(0,0,0,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -10px 18px rgba(0,0,0,0.35);
  }
  .skin-volumetric .leaf {
    background-color: #262c38;
    background: -webkit-linear-gradient(top, #333b4a 0%, #262c38 45%, #1a1e26 100%);
    color: #fdfdfb;
  }
  .skin-volumetric .seam { background-color: #050608; height: 3px; -webkit-box-shadow: 0 1px 0 rgba(255,255,255,0.06); box-shadow: 0 1px 0 rgba(255,255,255,0.06); }
  .skin-volumetric .colon i { background-color: #7c8aa8; -webkit-box-shadow: 0 0 8px rgba(124,138,168,0.7); box-shadow: 0 0 8px rgba(124,138,168,0.7); }
  .skin-volumetric .date { color: #8891a0; }

  /* ============ skin: fire ============ */
  .skin-fire .flap-unit { background-color: #1c130d; -webkit-box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 60px rgba(255,110,30,0.12); box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 60px rgba(255,110,30,0.12); }
  .skin-fire .flap-half { background-color: #241812; color: #ffd9ad; }
  .skin-fire .leaf { background-color: #241812; color: #ffd9ad; }
  .skin-fire .seam { background-color: #0d0704; }
  .skin-fire .colon i { background-color: #ff9d52; -webkit-box-shadow: 0 0 10px rgba(255,140,50,0.9); box-shadow: 0 0 10px rgba(255,140,50,0.9); }
  .skin-fire .date { color: #d98a4d; }

  /* ============ skin: neon ============ */
  .skin-neon .flap-unit {
    background-color: #0b0b14;
    -webkit-box-shadow: 0 0 0 1px rgba(70,230,255,0.35), 0 0 26px rgba(70,230,255,0.25), 0 14px 34px rgba(0,0,0,0.6);
    box-shadow: 0 0 0 1px rgba(70,230,255,0.35), 0 0 26px rgba(70,230,255,0.25), 0 14px 34px rgba(0,0,0,0.6);
  }
  .skin-neon .flap-half { background-color: #0f0f1a; color: #6ff2ff; }
  .skin-neon .leaf { background-color: #0f0f1a; color: #6ff2ff; }
  .skin-neon .seam { background-color: #ff3fd8; -webkit-box-shadow: 0 0 8px rgba(255,63,216,0.9); box-shadow: 0 0 8px rgba(255,63,216,0.9); }
  .skin-neon .colon i { background-color: #ff3fd8; -webkit-box-shadow: 0 0 10px rgba(255,63,216,0.9); box-shadow: 0 0 10px rgba(255,63,216,0.9); }
  .skin-neon .date { color: #ff7fe6; }

  /* ============ settings gear (reopens start screen) ============ */

  .gear {
    position: absolute;
    right: 22px;
    bottom: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    background-color: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.55);
    font-size: 18px;
    line-height: 40px;
    text-align: center;
    text-decoration: none;
    z-index: 6;
    -webkit-transition: opacity 0.4s ease;
    transition: opacity 0.4s ease;
  }
  .gear.hidden { opacity: 0; }

  /* ============ start / settings screen ============ */

  .start-screen {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    background-color: #0a0b0d;
    z-index: 50;
    -webkit-transition: opacity 0.35s ease;
    transition: opacity 0.35s ease;
  }
  .start-screen.closed {
    opacity: 0;
    pointer-events: none;
  }

  .start-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 420px;
    margin-left: -210px;
    -webkit-transform: translateY(-50%);
    transform: translateY(-50%);
    text-align: center;
    color: #f0e9da;
  }

  .start-title {
    font-family: "Big Shoulders Display", Arial, sans-serif;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: 1px;
    margin: 0 0 6px 0;
    color: #f0e9da;
  }

  .start-sub {
    font-size: 13px;
    letter-spacing: 1px;
    color: #7c766a;
    margin-bottom: 34px;
  }

  .field-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7c766a;
    text-align: left;
    margin-bottom: 12px;
  }

  .skin-grid {
    margin-bottom: 30px;
  }

  .skin-grid:after { content: ""; display: block; clear: both; }

  .skin-choice {
    float: left;
    width: 25%;
    text-decoration: none;
    color: #a89f8d;
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  .skin-swatch {
    display: block;
    width: 62px;
    height: 62px;
    margin: 0 auto 8px auto;
    border-radius: 12px;
    -webkit-border-radius: 12px;
    -webkit-box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
  }

  .skin-choice.active .skin-swatch {
    -webkit-box-shadow: 0 0 0 2px #ffffff;
    box-shadow: 0 0 0 2px #ffffff;
  }
  .skin-choice.active { color: #ffffff; }

  .swatch-classic { background-color: #201f1e; }
  .swatch-volumetric { background: -webkit-linear-gradient(top, #333b4a 0%, #1a1e26 100%); }
  .swatch-fire { background: -webkit-linear-gradient(top, #ff8c3c 0%, #24140b 100%); }
  .swatch-neon { background-color: #0f0f1a; -webkit-box-shadow: 0 0 0 2px #6ff2ff, 0 0 14px rgba(111,242,255,0.6); box-shadow: 0 0 0 2px #6ff2ff, 0 0 14px rgba(111,242,255,0.6); }
  .skin-choice.active .swatch-neon { -webkit-box-shadow: 0 0 0 2px #ff3fd8, 0 0 14px rgba(255,63,216,0.7); box-shadow: 0 0 0 2px #ff3fd8, 0 0 14px rgba(255,63,216,0.7); }

  .field-group.hidden { display: none; }

  .color-grid {
    margin-bottom: 30px;
    text-align: center;
  }
  .color-choice {
    display: inline-block;
    margin: 0 6px 6px 6px;
    text-decoration: none;
  }
  .color-swatch {
    display: block;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    -webkit-box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
  }
  .color-choice.active .color-swatch {
    -webkit-box-shadow: 0 0 0 2px #ffffff, 0 0 10px rgba(255,255,255,0.5);
    box-shadow: 0 0 0 2px #ffffff, 0 0 10px rgba(255,255,255,0.5);
  }

  .toggle-row {
    text-align: left;
    margin-bottom: 34px;
    font-size: 15px;
    color: #d8d2c4;
  }
  .toggle-row:after { content: ""; display: block; clear: both; }
  .toggle-row span.label { float: left; line-height: 30px; }

  .toggle {
    float: right;
    display: block;
    width: 50px;
    height: 30px;
    border-radius: 15px;
    -webkit-border-radius: 15px;
    background-color: #2a2a2a;
    position: relative;
    text-decoration: none;
  }
  .toggle-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    background-color: #f0e9da;
    -webkit-transition: left 0.18s ease;
    transition: left 0.18s ease;
  }
  .toggle.on { background-color: #d98a3d; }
  .toggle.on .toggle-knob { left: 23px; }

  .start-btn {
    display: block;
    padding: 15px 0;
    background-color: #d98a3d;
    color: #14100a;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 999px;
    -webkit-border-radius: 999px;
  }

  .start-hint {
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: #5c574c;
  }
</style>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>
<div class="glow glow-c"></div>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="date" id="date">&nbsp;</div>
</div>

<a href="#" class="gear hidden" id="gear">&#9881;</a>

<div class="start-screen" id="startScreen">
  <div class="start-inner">
    <div class="start-title">Flap Clock</div>
    <div class="start-sub">Настройка перед запуском</div>

    <div class="field-label">Оформление</div>
    <div class="skin-grid" id="skinGrid">
      <a href="#" class="skin-choice" data-skin="classic"><span class="skin-swatch swatch-classic"></span>Классика</a>
      <a href="#" class="skin-choice" data-skin="volumetric"><span class="skin-swatch swatch-volumetric"></span>Объём</a>

        <a href="#" class="color-choice" data-color="amber"><span class="color-swatch" style="background-color:#ff8c28"></span></a>
        <a href="#" class="color-choice" data-color="red"><span class="color-swatch" style="background-color:#ff3c32"></span></a>
        <a href="#" class="color-choice" data-color="blue"><span class="color-swatch" style="background-color:#468cff"></span></a>
        <a href="#" class="color-choice" data-color="green"><span class="color-swatch" style="background-color:#46c878"></span></a>
        <a href="#" class="color-choice" data-color="purple"><span class="color-swatch" style="background-color:#aa5aff"></span></a>
        <a href="#" class="color-choice" data-color="pink"><span class="color-swatch" style="background-color:#ff5aaa"></span></a>
        <a href="#" class="color-choice" data-color="cyan"><span class="color-swatch" style="background-color:#46dce6"></span></a>
        <a href="#" class="color-choice" data-color="white"><span class="color-swatch" style="background-color:#ffffff"></span></a>

  </div>
</div>

<script>
(function () {

  var board = document.getElementById("board");
  var dateEl = document.getElementById("date");
  var startScreen = document.getElementById("startScreen");
  var skinGrid = document.getElementById("skinGrid");
  var secondsToggle = document.getElementById("secondsToggle");
  var startBtn = document.getElementById("startBtn");
  var gear = document.getElementById("gear");

  function pad2(n) {
    n = "" + n;
    return n.length < 2 ? "0" + n : n;
  }

  /* ---------- settings: skin ---------- */

  var SKINS = ["classic", "volumetric", "fire", "neon"];

  function loadSetting(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) { return fallback; }
  }
  function saveSetting(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  var COLOR_SKINS = { fire: true, neon: true }; // skins whose color can be customized

  function applySkin(name) {
    document.body.className = "skin-" + name;
    saveSetting("flapclock-skin", name);

    var choices = skinGrid.getElementsByTagName("a");
    for (var i = 0; i < choices.length; i++) {
      var c = choices[i];
      c.className = "skin-choice" + (c.getAttribute("data-skin") === name ? " active" : "");
    }

    updateColorSectionVisibility();
    applyAccentColor(currentColorKey);
  }

  skinGrid.addEventListener("click", function (ev) {
    var t = ev.target;
    while (t && t !== skinGrid && !t.getAttribute("data-skin")) { t = t.parentNode; }
    if (t && t.getAttribute("data-skin")) {
      ev.preventDefault();
      applySkin(t.getAttribute("data-skin"));
    }
  }, false);

  /* ---------- settings: accent color (glow + neon skins only) ---------- */

  var ACCENT_COLORS = {
    amber:  { r: 255, g: 140, b: 40 },
    red:    { r: 255, g: 60,  b: 50 },
    blue:   { r: 70,  g: 140, b: 255 },
    green:  { r: 70,  g: 200, b: 120 },
    purple: { r: 170, g: 90,  b: 255 },
    pink:   { r: 255, g: 90,  b: 170 },
    cyan:   { r: 70,  g: 220, b: 230 },
    white:  { r: 255, g: 255, b: 255 }
  };
  var ACCENT_SWATCH_HEX = {
    amber: "#ff8c28", red: "#ff3c32", blue: "#468cff", green: "#46c878",
    purple: "#aa5aff", pink: "#ff5aaa", cyan: "#46dce6", white: "#ffffff"
  };
  var GLOW_OPACITY = [0.55, 0.4, 0.4]; // matches the original glow-a/b/c intensities

  var colorSection = document.getElementById("colorSection");
  var colorGrid = document.getElementById("colorGrid");
  var swatchGlow = document.getElementById("swatchGlow");
  var glowEls = [
    document.querySelector(".glow-a"),
    document.querySelector(".glow-b"),
    document.querySelector(".glow-c")
  ];

  function mix(component, towardWhite) {
    return Math.round(component + (255 - component) * towardWhite);
  }

  function updateColorSectionVisibility() {
    colorSection.className = "field-group" + (COLOR_SKINS[document.body.className.replace("skin-", "")] ? "" : " hidden");
  }

  function applyAccentColor(key) {
    var c = ACCENT_COLORS[key] || ACCENT_COLORS.amber;
    currentColorKey = key;

    for (var i = 0; i < glowEls.length; i++) {
      var op = GLOW_OPACITY[i];
      var rgba1 = "rgba(" + c.r + "," + c.g + "," + c.b + "," + op + ")";
      var rgba0 = "rgba(" + c.r + "," + c.g + "," + c.b + ",0)";
      glowEls[i].style.background = "-webkit-radial-gradient(50% 50%, ellipse farthest-side, " + rgba1 + " 0%, " + rgba0 + " 70%)";
    }
    if (swatchGlow) { swatchGlow.style.background = ACCENT_SWATCH_HEX[key] || ACCENT_SWATCH_HEX.amber; }
    saveSetting("flapclock-glow-color", key);

    var choices = colorGrid.getElementsByTagName("a");
    for (var j = 0; j < choices.length; j++) {
      var ch = choices[j];
      ch.className = "color-choice" + (ch.getAttribute("data-color") === key ? " active" : "");
    }

    var skinName = document.body.className.replace("skin-", "");
    var customizable = !!COLOR_SKINS[skinName];

    var inkColor = "rgb(" + mix(c.r, 0.78) + "," + mix(c.g, 0.78) + "," + mix(c.b, 0.78) + ")";
    var dimColor = "rgba(" + c.r + "," + c.g + "," + c.b + ",0.9)";
    var solidColor = "rgb(" + c.r + "," + c.g + "," + c.b + ")";
    var boxShadow;
    if (skinName === "neon") {
      boxShadow = "0 0 0 1px rgba(" + c.r + "," + c.g + "," + c.b + ",0.4), " +
                  "0 0 26px rgba(" + c.r + "," + c.g + "," + c.b + ",0.3), " +
                  "0 14px 34px rgba(0,0,0,0.6)";
    } else {
      boxShadow = "0 16px 40px rgba(0,0,0,0.6), 0 0 60px rgba(" + c.r + "," + c.g + "," + c.b + ",0.16)";
    }
    var dotShadow = "0 0 10px rgba(" + c.r + "," + c.g + "," + c.b + ",0.9)";

    var i2, list;

    list = document.querySelectorAll(".flap-half, .leaf");
    for (i2 = 0; i2 < list.length; i2++) { list[i2].style.color = customizable ? inkColor : ""; }

    list = document.querySelectorAll(".date");
    for (i2 = 0; i2 < list.length; i2++) { list[i2].style.color = customizable ? dimColor : ""; }

    list = document.querySelectorAll(".seam");
    for (i2 = 0; i2 < list.length; i2++) { list[i2].style.backgroundColor = customizable ? solidColor : ""; }

    list = document.querySelectorAll(".colon i");
    for (i2 = 0; i2 < list.length; i2++) {
      list[i2].style.backgroundColor = customizable ? solidColor : "";
      list[i2].style.boxShadow = customizable ? dotShadow : "";
      list[i2].style.webkitBoxShadow = customizable ? dotShadow : "";
    }

    list = document.querySelectorAll(".flap-unit");
    for (i2 = 0; i2 < list.length; i2++) {
      list[i2].style.boxShadow = customizable ? boxShadow : "";
      list[i2].style.webkitBoxShadow = customizable ? boxShadow : "";
    }
  }

  colorGrid.addEventListener("click", function (ev) {
    var t = ev.target;
    while (t && t !== colorGrid && !t.getAttribute("data-color")) { t = t.parentNode; }
    if (t && t.getAttribute("data-color")) {
      ev.preventDefault();
      applyAccentColor(t.getAttribute("data-color"));
    }
  }, false);

  var currentColorKey = loadSetting("flapclock-glow-color", "amber");

  var savedSkin = loadSetting("flapclock-skin", "classic");
  if (SKINS.indexOf ? SKINS.indexOf(savedSkin) === -1 : true) {
    var found = false;
    for (var si = 0; si < SKINS.length; si++) { if (SKINS[si] === savedSkin) { found = true; } }
    if (!found) { savedSkin = "classic"; }
  }
  applySkin(savedSkin);

  /* ---------- settings: seconds ---------- */

  var showSeconds = loadSetting("flapclock-seconds", "0") === "1";

  function applySecondsToggleUI() {
    secondsToggle.className = "toggle" + (showSeconds ? " on" : "");
  }

  secondsToggle.addEventListener("click", function (ev) {
    ev.preventDefault();
    showSeconds = !showSeconds;
    saveSetting("flapclock-seconds", showSeconds ? "1" : "0");
    applySecondsToggleUI();
    updateSecondsVisibility();
  }, false);

  applySecondsToggleUI();

  /* ---------- clock ---------- */

  var units = {}; // key -> {front, back, top, bottom, value, el}

  function makeGroup(count, prefix) {
    var grp = document.createElement("div");
    grp.className = "grp";
    for (var i = 0; i < count; i++) {
      grp.appendChild(makeUnit(prefix + i));
    }
    return grp;
  }

  function makeUnit(key) {
    var unit = document.createElement("div");
    unit.className = "flap-unit";

    var top = document.createElement("div");
    top.className = "flap-half flap-top";
    var topSpan = document.createElement("span");
    topSpan.appendChild(document.createTextNode("0"));
    top.appendChild(topSpan);

    var bottom = document.createElement("div");
    bottom.className = "flap-half flap-bottom";
    var bottomSpan = document.createElement("span");
    bottomSpan.appendChild(document.createTextNode("0"));
    bottom.appendChild(bottomSpan);

    var leafFront = document.createElement("div");
    leafFront.className = "leaf leaf-front";
    var frontSpan = document.createElement("span");
    frontSpan.appendChild(document.createTextNode("0"));
    leafFront.appendChild(frontSpan);

    var leafBack = document.createElement("div");
    leafBack.className = "leaf leaf-back";
    var backSpan = document.createElement("span");
    backSpan.appendChild(document.createTextNode("0"));
    leafBack.appendChild(backSpan);

    var seam = document.createElement("div");
    seam.className = "seam";

    unit.appendChild(top);
    unit.appendChild(bottom);
    unit.appendChild(leafFront);
    unit.appendChild(leafBack);
    unit.appendChild(seam);

    units[key] = {
      el: unit, top: topSpan, bottom: bottomSpan,
      front: frontSpan, back: backSpan, value: "0"
    };
    return unit;
  }

  function makeColon() {
    var colon = document.createElement("div");
    colon.className = "colon";
    var dotTop = document.createElement("i");
    dotTop.className = "dot-top";
    var dotBottom = document.createElement("i");
    dotBottom.className = "dot-bottom";
    colon.appendChild(dotTop);
    colon.appendChild(dotBottom);
    return colon;
  }

  function setText(span, value) {
    span.removeChild(span.firstChild);
    span.appendChild(document.createTextNode(value));
  }

  board.appendChild(makeGroup(2, "h"));
  board.appendChild(makeColon());
  board.appendChild(makeGroup(2, "m"));
  var colon2 = makeColon();
  board.appendChild(colon2);
  var secGroup = makeGroup(2, "s");
  board.appendChild(secGroup);

  function updateSecondsVisibility() {
    colon2.className = "colon" + (showSeconds ? "" : " hidden");
    secGroup.className = "grp" + (showSeconds ? "" : " hidden");
  }
  updateSecondsVisibility();

  function setDigit(key, value, animated) {
    var u = units[key];
    if (u.value === value) { return; }

    if (u.topTimer) { clearTimeout(u.topTimer); u.topTimer = null; }
    if (u.bottomTimer) { clearTimeout(u.bottomTimer); u.bottomTimer = null; }
    if (u.endTimer) { clearTimeout(u.endTimer); u.endTimer = null; }

    if (!animated) {
      setText(u.top, value);
      setText(u.bottom, value);
      u.value = value;
      return;
    }

    setText(u.front, u.value);
    setText(u.back, value);

    u.el.className = "flap-unit";
    u.el.offsetWidth; // restart animation
    u.el.className = "flap-unit flipping";

    /* leaf-front plays its whole 160ms visible quarter-turn (0deg->-90deg),
       then leaf-back immediately continues with its own 160ms visible
       quarter-turn (90deg->0deg) -- back to back, no dead gap. Swap each
       static half's text right as its leaf finishes covering it, so the
       reveal underneath is seamless. */
    u.topTimer = setTimeout(function () {
      setText(u.top, value);
      u.topTimer = null;
    }, 160);

    u.bottomTimer = setTimeout(function () {
      setText(u.bottom, value);
      u.bottomTimer = null;
    }, 320);

    u.endTimer = setTimeout(function () {
      u.el.className = "flap-unit";
      u.value = value;
      u.endTimer = null;
    }, 340);
  }

  var months = ["января", "февраля", "марта", "апреля",
    "мая", "июня", "июля", "августа",
    "сентября", "октября", "ноября", "декабря"];
  var weekdays = ["воскресенье", "понедельник", "вторник", "среда",
    "четверг", "пятница", "суббота"];

  var lastDay = -1;
  var firstTick = true;

  function tick() {
    var now = new Date();
    var hh = pad2(now.getHours());
    var mm = pad2(now.getMinutes());
    var ss = pad2(now.getSeconds());
    var animated = !firstTick;

    setDigit("h0", hh.charAt(0), animated);
    setDigit("h1", hh.charAt(1), animated);
    setDigit("m0", mm.charAt(0), animated);
    setDigit("m1", mm.charAt(1), animated);
    setDigit("s0", ss.charAt(0), animated);
    setDigit("s1", ss.charAt(1), animated);

    firstTick = false;

    if (now.getDate() !== lastDay) {
      lastDay = now.getDate();
      var text = weekdays[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
      dateEl.innerHTML = text.charAt(0).toUpperCase() + text.slice(1);
    }
  }

  tick();
  setInterval(tick, 1000);

  /* ---------- start screen open/close ---------- */

  var gearTimer = null;

  function showGear() {
    gear.className = "gear";
    clearTimeout(gearTimer);
    gearTimer = setTimeout(function () { gear.className = "gear hidden"; }, 5000);
  }

  function closeStart() {
    startScreen.className = "start-screen closed";
    showGear();
  }

  function openStart() {
    startScreen.className = "start-screen";
    gear.className = "gear hidden";
    clearTimeout(gearTimer);
  }

  startBtn.addEventListener("click", function (ev) {
    ev.preventDefault();
    closeStart();
  }, false);

  gear.addEventListener("click", function (ev) {
    ev.preventDefault();
    openStart();
  }, false);

  document.addEventListener("touchend", function (ev) {
    if (startScreen.className.indexOf("closed") === -1) { return; }
    if (gear.contains && gear.contains(ev.target)) { return; }
    showGear();
  }, false);
  document.addEventListener("click", function (ev) {
    if (startScreen.className.indexOf("closed") === -1) { return; }
    if (gear === ev.target) { return; }
    showGear();
  }, false);

})();
</script>
