<meta charset="utf-8">
<title>Flap Clock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Archivo:ital,wght@0,500;0,600;1,500&display=swap');

  :root {
    --bg: #0a0b0d;
    --bg-glow: #191510;
    --panel: #201f1e;
    --panel-lo: #161514;
    --seam: #030303;
    --ink: #f0e9da;
    --ink-dim: #a89f8d;
    --accent: #d98a3d;
    --accent-dim: #6b4a26;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, var(--bg-glow) 0%, var(--bg) 68%);
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 3.5vh, 44px);
  }

  .board {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.6vw, 22px);
  }

  .colon {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vh, 22px);
    justify-content: center;
    padding: 0 clamp(2px, 0.4vw, 6px);
  }

  .colon i {
    display: block;
    width: clamp(7px, 1.1vw, 13px);
    height: clamp(7px, 1.1vw, 13px);
    border-radius: 50%;
    background: var(--ink-dim);
    opacity: 0.55;
    font-style: normal;
  }

  .grp {
    display: flex;
    gap: clamp(6px, 1vw, 12px);
  }

  /* --- split-flap digit unit --- */

  .flap-unit {
    position: relative;
    width: clamp(64px, 11vw, 176px);
    height: clamp(96px, 16.5vw, 264px);
    border-radius: clamp(6px, 0.7vw, 12px);
    background: var(--panel-lo);
    box-shadow:
      0 clamp(10px, 1.6vw, 28px) clamp(24px, 3.4vw, 60px) rgba(0, 0, 0, 0.55),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    perspective: 600px;
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 800;
  }

  .flap-half {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    background: var(--panel);
    color: var(--ink);
  }

  .flap-half span {
    position: absolute;
    left: 0;
    right: 0;
    height: 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(52px, 9.2vw, 148px);
    line-height: 1;
  }

  .flap-top {
    top: 0;
    border-radius: clamp(6px, 0.7vw, 12px) clamp(6px, 0.7vw, 12px) 0 0;
  }
  .flap-top span { top: 0; }

  .flap-bottom {
    bottom: 0;
    border-radius: 0 0 clamp(6px, 0.7vw, 12px) clamp(6px, 0.7vw, 12px);
  }
  .flap-bottom span { top: -100%; }

  .flap-unit::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-1px);
    background: var(--seam);
    z-index: 5;
  }

  /* the two moving leaves: only ever shown while a flip is in progress,
     so a fragile backface-visibility misrender can never leak into the resting state */
  .leaf {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    background: var(--panel);
    color: var(--ink);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    opacity: 0;
    z-index: 4;
  }

  .flap-unit.flipping .leaf {
    opacity: 1;
  }

  .leaf span {
    position: absolute;
    left: 0;
    right: 0;
    height: 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(52px, 9.2vw, 148px);
    line-height: 1;
  }

  .leaf-front {
    top: 0;
    border-radius: clamp(6px, 0.7vw, 12px) clamp(6px, 0.7vw, 12px) 0 0;
    transform-origin: bottom center;
  }
  .leaf-front span { top: 0; }

  .leaf-back {
    bottom: 0;
    border-radius: 0 0 clamp(6px, 0.7vw, 12px) clamp(6px, 0.7vw, 12px);
    transform-origin: top center;
    transform: rotateX(180deg);
  }
  .leaf-back span { top: -100%; }

  .leaf::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0));
    pointer-events: none;
  }
  .leaf-back::before {
    background: linear-gradient(to top, rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0));
  }

  .flap-unit.flipping .leaf-front {
    animation: flipDown 0.32s cubic-bezier(0.4, 0.0, 1, 1) forwards;
  }
  .flap-unit.flipping .leaf-back {
    animation: flipUp 0.32s cubic-bezier(0, 0, 0.2, 1) 0.32s forwards;
  }

  @keyframes flipDown {
    from { transform: rotateX(0deg); }
    to   { transform: rotateX(-180deg); }
  }
  @keyframes flipUp {
    from { transform: rotateX(180deg); }
    to   { transform: rotateX(0deg); }
  }

  .meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1vh, 10px);
  }

  .date {
    font-size: clamp(13px, 1.7vw, 20px);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .date b {
    color: var(--accent);
    font-weight: 600;
  }

  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: clamp(18px, 4vh, 40px);
    display: flex;
    justify-content: center;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }

  .hint span {
    font-size: clamp(11px, 1.3vw, 13px);
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 0.6em 1.1em;
    border-radius: 999px;
  }

  .hint.gone { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .flap-unit.flipping .leaf-front,
    .flap-unit.flipping .leaf-back {
      animation-duration: 0.01ms;
    }
  }
</style>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="meta">
    <div class="date" id="date">&nbsp;</div>
  </div>
</div>

<div class="hint" id="hint"><span>Поделиться → На экран «Домой» — для полноэкранного режима</span></div>

<!-- silent muted loop keeps iOS from sleeping the display (Wake Lock API is unavailable on old Safari) -->
<video id="nosleep" muted playsinline loop style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"
  src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAAqW1kYXQAAAAfTGF2YzYwLjMuAADCk3sAAAAAAgD+AAAAAA==">
</video>

<script>
(function () {
  "use strict";

  var board = document.getElementById("board");
  var dateEl = document.getElementById("date");
  var hint = document.getElementById("hint");

  var units = {}; // key -> {front, back, top, bottom, value}

  function makeGroup(count, prefix) {
    var grp = document.createElement("div");
    grp.className = "grp";
    for (var i = 0; i < count; i++) {
      grp.appendChild(makeUnit(prefix + i));
    }
    board.appendChild(grp);
  }

  function makeUnit(key) {
    var unit = document.createElement("div");
    unit.className = "flap-unit";

    var top = document.createElement("div");
    top.className = "flap-half flap-top";
    var topSpan = document.createElement("span");
    topSpan.textContent = "0";
    top.appendChild(topSpan);

    var bottom = document.createElement("div");
    bottom.className = "flap-half flap-bottom";
    var bottomSpan = document.createElement("span");
    bottomSpan.textContent = "0";
    bottom.appendChild(bottomSpan);

    var leafFront = document.createElement("div");
    leafFront.className = "leaf leaf-front";
    var frontSpan = document.createElement("span");
    frontSpan.textContent = "0";
    leafFront.appendChild(frontSpan);

    var leafBack = document.createElement("div");
    leafBack.className = "leaf leaf-back";
    var backSpan = document.createElement("span");
    backSpan.textContent = "0";
    leafBack.appendChild(backSpan);

    unit.appendChild(top);
    unit.appendChild(bottom);
    unit.appendChild(leafFront);
    unit.appendChild(leafBack);

    units[key] = {
      el: unit, top: topSpan, bottom: bottomSpan,
      front: frontSpan, back: backSpan, value: "0"
    };
    return unit;
  }

  makeGroup(2, "h"); // hours
  var colon = document.createElement("div");
  colon.className = "colon";
  colon.innerHTML = "<i></i><i></i>";
  board.appendChild(colon);
  makeGroup(2, "m"); // minutes

  function setDigit(key, value, animated) {
    var u = units[key];
    if (u.value === value) return;

    if (!animated) {
      u.top.textContent = value;
      u.bottom.textContent = value;
      u.value = value;
      return;
    }

    u.front.textContent = u.value;
    u.back.textContent = value;

    u.el.classList.remove("flipping");
    void u.el.offsetWidth; // restart animation
    u.el.classList.add("flipping");

    var doneAfter = 660;
    setTimeout(function () {
      u.top.textContent = value;
      u.bottom.textContent = value;
      u.el.classList.remove("flipping");
      u.value = value;
    }, doneAfter);
  }

  var months = ["января", "февраля", "марта", "апреля",
    "мая", "июня", "июля", "августа",
    "сентября", "октября", "ноября", "декабря"];
  var weekdays = ["воскресенье", "понедельник", "вторник", "среда",
    "четверг", "пятница", "суббота"];

  var lastDay = -1;
  var firstTick = true;

  function tick() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, "0");
    var mm = String(now.getMinutes()).padStart(2, "0");
    var animated = !firstTick;

    setDigit("h0", hh[0], animated);
    setDigit("h1", hh[1], animated);
    setDigit("m0", mm[0], animated);
    setDigit("m1", mm[1], animated);

    firstTick = false;

    if (now.getDate() !== lastDay) {
      lastDay = now.getDate();
      var text = weekdays[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
      dateEl.innerHTML = text.charAt(0).toUpperCase() + text.slice(1);
    }
  }

  tick();
  setInterval(tick, 1000);

  // keep the iPad screen awake: loop a near-invisible silent video (Wake Lock API
  // does not exist in Safari on iOS 9), and re-request fullscreen after any tap.
  var nosleep = document.getElementById("nosleep");
  function primeNoSleep() {
    nosleep.play().catch(function () {});
    var docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(function () {});
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
    hint.classList.add("gone");
    window.removeEventListener("touchend", primeNoSleep);
    window.removeEventListener("click", primeNoSleep);
  }
  window.addEventListener("touchend", primeNoSleep);
  window.addEventListener("click", primeNoSleep);

  setTimeout(function () { hint.classList.add("gone"); }, 12000);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) nosleep.play().catch(function () {});
  });
})();
</script>
